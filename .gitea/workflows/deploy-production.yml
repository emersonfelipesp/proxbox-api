name: Deploy proxbox-api

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      deploy_source:
        description: "Immutable Gitea package by default; canonical main is an explicit override"
        required: true
        default: latest_package
        type: choice
        options:
          - latest_package
          - main_branch
      package_version:
        description: "Exact package version (required only for latest_package)"
        required: false
        default: ""
        type: string
      skip_ci_gate:
        description: "EMERGENCY ONLY: deploy without green CI for the exact source SHA"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: proxbox-api-${{ github.event_name == 'push' && 'staging' || 'production' }}-deploy
  cancel-in-progress: false

jobs:
  verify-ci:
    name: Verify CI for the exact deployed source
    runs-on: prod-deploy
    outputs:
      deploy_sha: ${{ steps.source.outputs.deploy_sha }}
    steps:
      - name: Checkout canonical workflow source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the immutable deployed source SHA
        id: source
        env:
          DEPLOY_SOURCE: ${{ inputs.deploy_source }}
          EVENT_NAME: ${{ github.event_name }}
          PACKAGE_VERSION: ${{ inputs.package_version }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          DEPLOY_SHA="$WORKFLOW_SHA"
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            test "$WORKFLOW_REF" = refs/heads/main
            if [ "$DEPLOY_SOURCE" = latest_package ]; then
              printf '%s' "$PACKAGE_VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(rc[1-9][0-9]*|\.post[1-9][0-9]*)?$'
              git fetch --force --no-tags origin \
                "+refs/heads/develop:refs/remotes/gitea/release-develop" \
                "+refs/tags/v${PACKAGE_VERSION}:refs/release-policy/candidate"
              DEPLOY_SHA="$(git rev-parse refs/release-policy/candidate^{commit})"
              git merge-base --is-ancestor "$DEPLOY_SHA" refs/remotes/gitea/release-develop
            else
              test "$DEPLOY_SOURCE" = main_branch
              test -z "$PACKAGE_VERSION"
            fi
          fi
          printf '%s' "$DEPLOY_SHA" | grep -Eq '^[a-f0-9]{40}$'
          printf 'deploy_sha=%s\n' "$DEPLOY_SHA" >> "$GITHUB_OUTPUT"

      - name: Require a green CI status for the deployed SHA
        env:
          DEPLOY_SHA: ${{ steps.source.outputs.deploy_sha }}
          REQUESTED_REF: ""
          SKIP_CI_GATE: ${{ inputs.skip_ci_gate }}
          REQUIRED_CI_CONTEXT: "CI / Lint, smoke, and core coverage (push)"
          API_BASE: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          GITEA_API_TOKEN: ${{ secrets.GITEA_TOKEN || github.token }}
          CI_GATE_TIMEOUT_SECONDS: "5400"
        run: python3 .gitea/scripts/require_ci_status.py

  staging:
    name: Deploy service to staging
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    needs: verify-ci
    runs-on: prod-deploy
    steps:
      - name: Deploy reviewed develop commit
        run: |
          set -euo pipefail
          printf '%s' "$GITHUB_SHA" | grep -Eq '^[a-f0-9]{40}$'
          /opt/nmulticloud/deploy/bin/deploy-app proxbox-api-staging "$GITHUB_SHA"

  production:
    name: Deploy service to production through NMS-selected source
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: verify-ci
    runs-on: prod-deploy
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_SOURCE: ${{ inputs.deploy_source }}
      PACKAGE_VERSION: ${{ inputs.package_version }}
      WORKFLOW_REF: ${{ github.ref }}
      WORKFLOW_SHA: ${{ github.sha }}
      VERIFIED_DEPLOY_SHA: ${{ needs.verify-ci.outputs.deploy_sha }}
    steps:
      - name: Checkout canonical workflow source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate source-aware production request
        run: |
          set -euo pipefail
          test "$WORKFLOW_REF" = refs/heads/main
          printf '%s' "$WORKFLOW_SHA" | grep -Eq '^[a-f0-9]{40}$'
          case "$DEPLOY_SOURCE" in
            latest_package)
              printf '%s' "$PACKAGE_VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(rc[1-9][0-9]*|\.post[1-9][0-9]*)?$'
              ;;
            main_branch)
              test -z "$PACKAGE_VERSION"
              ;;
            *) exit 1 ;;
          esac

      - name: Bind exact package artifacts before deployment
        if: ${{ inputs.deploy_source == 'latest_package' }}
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin \
            "+refs/heads/develop:refs/remotes/gitea/release-develop" \
            "+refs/tags/v${PACKAGE_VERSION}:refs/release-policy/candidate"
          SOURCE_SHA="$(git rev-parse refs/release-policy/candidate^{commit})"
          test "$SOURCE_SHA" = "$VERIFIED_DEPLOY_SHA"
          git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/gitea/release-develop
          python3 scripts/release_artifacts.py fetch-gitea \
            --owner emersonfelipesp --repository proxbox-api \
            --package proxbox_api --version "$PACKAGE_VERSION" \
            --source-sha "$SOURCE_SHA" --dist release-dist \
            --manifest release-manifest.json

      - name: Deploy exact Gitea package
        if: ${{ inputs.deploy_source == 'latest_package' }}
        run: |
          set -euo pipefail
          /opt/nmulticloud/deploy/bin/deploy-app-package \
            proxbox-api "$PACKAGE_VERSION" "$GITHUB_RUN_ID"

      - name: Deploy canonical main override
        if: ${{ inputs.deploy_source == 'main_branch' }}
        run: |
          set -euo pipefail
          test "$WORKFLOW_SHA" = "$VERIFIED_DEPLOY_SHA"
          /opt/nmulticloud/deploy/bin/deploy-app proxbox-api "$WORKFLOW_SHA"

      - name: Require healthy production status
        run: /opt/nmulticloud/deploy/bin/healthcheck-app proxbox-api

      - name: Publish host-issued successful-deployment attestation
        # Emergency CI bypasses may restore service, but can never authorize
        # public package promotion. Missing evidence remains fail closed.
        if: ${{ inputs.deploy_source == 'latest_package' && inputs.skip_ci_gate != true }}
        env:
          GITEA_PACKAGE_TOKEN: ${{ secrets.PKG_TOKEN }}
        run: |
          set -euo pipefail
          /opt/nmulticloud/deploy/bin/export-package-deploy-receipt \
            proxbox-api "$PACKAGE_VERSION" "$GITHUB_RUN_ID" > completion.json
          python3 scripts/release_artifacts.py validate-attestation \
            --manifest release-manifest.json --attestation completion.json \
            --repository emersonfelipesp/proxbox-api
          python3 scripts/release_artifacts.py publish-attestation \
            --owner emersonfelipesp --repository proxbox-api \
            --manifest release-manifest.json --attestation completion.json

      - name: Report failure status
        if: failure()
        run: /opt/nmulticloud/deploy/bin/status-app proxbox-api
