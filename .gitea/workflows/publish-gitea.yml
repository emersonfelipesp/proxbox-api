name: Gitea Release — Build Control Request

on:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: read

concurrency:
  group: release-request-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate-source:
    name: Validate canonical release source
    runs-on: ci-release-proxbox-api
    outputs:
      source_sha: ${{ steps.policy.outputs.source_sha }}
      tag: ${{ steps.policy.outputs.tag }}
      version: ${{ steps.policy.outputs.version }}
    steps:
      - name: Checkout exact release source with the image-baked Gitea client
        env:
          GITEA_JOB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -z "$(find . -mindepth 1 -maxdepth 1 -print -quit)"
          /usr/local/bin/nmc-gitea-checkout \
            --repository "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" \
            --sha "$GITHUB_SHA" --destination .

      - name: Prove exact accepted release runner before source validation
        env:
          GITEA_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f scripts/gitea_release_runner_gate.py
          test ! -L scripts/gitea_release_runner_gate.py
          test -f .gitea/release-runner-acceptance.json
          test ! -L .gitea/release-runner-acceptance.json
          printf '%s  %s\n' \
            9f85dd453d285cb1c79483b19ad1781b4ed7df635695d80c6769a09abd178027 \
            scripts/gitea_release_runner_gate.py | sha256sum --check --strict
          printf '%s  %s\n' \
            b299b14006004732f906e1f03e8325094c9aebe9efb56bb579b2c376eb86072e \
            .gitea/release-runner-acceptance.json | sha256sum --check --strict
          python3 -I scripts/gitea_release_runner_gate.py \
            --acceptance .gitea/release-runner-acceptance.json \
            --owner emersonfelipesp --repository proxbox-api \
            --run-id "$GITHUB_RUN_ID" \
            --job-name "Validate canonical release source" \
            --source-sha "$(git rev-parse HEAD^{commit})"

      - name: Bind tag, version, canonical develop, and successful CI
        id: policy
        env:
          GITEA_API_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]* | v[0-9]*.[0-9]*.[0-9]*rc[0-9]* | v[0-9]*.[0-9]*.[0-9]*.post[0-9]*) ;;
            *) echo "Invalid release tag: $TAG"; exit 1 ;;
          esac
          git fetch --force --no-tags origin \
            "+refs/heads/develop:refs/remotes/gitea/release-develop" \
            "+refs/tags/${TAG}:refs/release-policy/candidate"
          SOURCE_SHA="$(git rev-parse refs/release-policy/candidate^{commit})"
          DEVELOP_SHA="$(git rev-parse refs/remotes/gitea/release-develop^{commit})"
          test "$SOURCE_SHA" = "$DEVELOP_SHA"
          test "$SOURCE_SHA" = "$(git rev-parse HEAD^{commit})"
          VERSION="${TAG#v}"
          python3 - "$VERSION" <<'PY'
          import pathlib
          import re
          import sys
          import tomllib

          version = sys.argv[1]
          if re.fullmatch(r"(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)(?:rc[1-9][0-9]*|\.post[1-9][0-9]*)?", version) is None:
              raise SystemExit("Release version is not canonical")
          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          if project["project"]["name"] != "proxbox_api":
              raise SystemExit("Unexpected package identity")
          if project["project"]["version"] != version:
              raise SystemExit("Tag and pyproject version differ")
          PY
          test -f scripts/gitea_ci_gate.py
          test ! -L scripts/gitea_ci_gate.py
          printf '%s  %s\n' \
            ac39691b607ab40665026d5c1d2b49f985ea1b3778a393fd24d7710006ad30a5 \
            scripts/gitea_ci_gate.py | sha256sum --check --strict
          python3 -I scripts/gitea_ci_gate.py \
            --owner emersonfelipesp --repository proxbox-api \
            --source-sha "$SOURCE_SHA" --trusted-actor emersonfelipesp \
            --github-required-job "Build extracted offline release sdist" \
            --github-workflow-sha256 1b7946a1ab787507b24c404b4fe5e3805645cd21bca1dccee215393a798d6dad \
            --required-context "CI / Lint, smoke, and core coverage (push)"
          printf 'tag=%s\nversion=%s\nsource_sha=%s\n' \
            "$TAG" "$VERSION" "$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  build-request:
    name: Build exact credential-free release-control request
    needs: validate-source
    runs-on: ci-release-proxbox-api
    steps:
      - name: Fetch validated public source with image-baked Git
        env:
          SOURCE_SHA: ${{ needs.validate-source.outputs.source_sha }}
        run: |
          set -euo pipefail
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GITEA_TOKEN:-}"
          test -z "$(find . -mindepth 1 -maxdepth 1 -print -quit)"
          export GIT_CONFIG_NOSYSTEM=1
          export GIT_CONFIG_GLOBAL=/dev/null
          git init --quiet
          git remote add origin https://git.nmulti.cloud/emersonfelipesp/proxbox-api.git
          git fetch --quiet --force --no-tags --depth=1 origin "$SOURCE_SHA"
          git -c advice.detachedHead=false checkout --quiet --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Prove exact accepted release runner before candidate execution
        env:
          GITEA_API_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.validate-source.outputs.source_sha }}
        run: |
          set -euo pipefail
          test -f scripts/gitea_release_runner_gate.py
          test ! -L scripts/gitea_release_runner_gate.py
          test -f .gitea/release-runner-acceptance.json
          test ! -L .gitea/release-runner-acceptance.json
          printf '%s  %s\n' \
            9f85dd453d285cb1c79483b19ad1781b4ed7df635695d80c6769a09abd178027 \
            scripts/gitea_release_runner_gate.py | sha256sum --check --strict
          printf '%s  %s\n' \
            b299b14006004732f906e1f03e8325094c9aebe9efb56bb579b2c376eb86072e \
            .gitea/release-runner-acceptance.json | sha256sum --check --strict
          python3 -I scripts/gitea_release_runner_gate.py \
            --acceptance .gitea/release-runner-acceptance.json \
            --owner emersonfelipesp --repository proxbox-api \
            --run-id "$GITHUB_RUN_ID" \
            --job-name "Build exact credential-free release-control request" \
            --source-sha "$SOURCE_SHA"

      - name: Bind the image-baked offline release toolchain
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test ! -L /usr/local/bin/python3
          test ! -L /usr/local/bin/uv
          test "$(stat -c '%u:%g:%a:%h:%F' /usr/local/bin/python3)" = '0:0:755:1:regular file'
          test "$(stat -c '%u:%g:%a:%h:%F' /usr/local/bin/uv)" = '0:0:755:1:regular file'
          test "$(/usr/local/bin/python3 -I -c 'import platform; print(platform.python_version())')" = 3.12.14
          test "$(/usr/local/bin/uv --version)" = "uv 0.12.5 (x86_64-unknown-linux-gnu)"
          printf '%s  %s\n' \
            aa4c3252dd9aa62dae1f43178e0063c7f43706418d3cdfe0cee28dbb806635fd \
            uv.lock | sha256sum --check --strict
          test "$(cat /opt/nmc-release/proxbox-api/uv.lock.sha256)" = \
            aa4c3252dd9aa62dae1f43178e0063c7f43706418d3cdfe0cee28dbb806635fd
          test -d /opt/nmc-release/proxbox-api/publish-wheels
          test -d /opt/nmc-release/proxbox-api/runtime-wheels
          test ! -L /opt/nmc-release/proxbox-api/publish-wheels
          test ! -L /opt/nmc-release/proxbox-api/runtime-wheels
          /usr/local/bin/nmc-verify-release-wheelhouse \
            --wheelhouse /opt/nmc-release/proxbox-api/publish-wheels \
            --manifest /opt/nmc-release/proxbox-api/publish-wheels.sha256
          /usr/local/bin/nmc-verify-release-wheelhouse \
            --wheelhouse /opt/nmc-release/proxbox-api/runtime-wheels \
            --manifest /opt/nmc-release/proxbox-api/runtime-wheels.sha256
          printf '%s\n' \
            'UV_BIN=/usr/local/bin/uv' \
            'UV_PYTHON=/usr/local/bin/python3' \
            'NMC_PUBLISH_WHEELHOUSE=/opt/nmc-release/proxbox-api/publish-wheels' \
            'NMC_RUNTIME_WHEELHOUSE=/opt/nmc-release/proxbox-api/runtime-wheels' \
            >> "$GITHUB_ENV"

      - name: Build artifacts across a token-free UID boundary
        env:
          BUILD_ROOT: /nmc-build/proxbox-api-${{ github.run_id }}-${{ github.run_attempt }}
          SOURCE_SHA: ${{ needs.validate-source.outputs.source_sha }}
          TAG: ${{ needs.validate-source.outputs.tag }}
          VERSION: ${{ needs.validate-source.outputs.version }}
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_RUN_ATTEMPT" = 1
          test ! -e "$BUILD_ROOT"
          test ! -L "$BUILD_ROOT"
          printf '%s  %s\n' \
            fae474ac9e18f762da67bdd22240f6630631d1730bd78d64fdcd8b6f17bc03a9 \
            scripts/gitea_release_build_boundary.py | sha256sum --check --strict
          python3 -I scripts/gitea_release_build_boundary.py \
            --build-root "$BUILD_ROOT" --uv-bin "$UV_BIN" \
            --python-bin "$UV_PYTHON" \
            --publish-wheelhouse "$NMC_PUBLISH_WHEELHOUSE" \
            --runtime-wheelhouse "$NMC_RUNTIME_WHEELHOUSE" \
            --source-sha "$SOURCE_SHA" \
            --tag "$TAG" --version "$VERSION" --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Bind exact artifacts into the control request
        env:
          BUILD_ROOT: /nmc-build/proxbox-api-${{ github.run_id }}-${{ github.run_attempt }}
          SOURCE_SHA: ${{ needs.validate-source.outputs.source_sha }}
          TAG: ${{ needs.validate-source.outputs.tag }}
          VERSION: ${{ needs.validate-source.outputs.version }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s  %s\n' \
            4017b7dc0443e4827f27c0571d41188e63f19bffdcb3e785307de1a084561002 \
            scripts/gitea_release_handoff.py | sha256sum --check --strict
          python3 -I scripts/gitea_release_handoff.py \
            --build-root "$BUILD_ROOT" --transfer-root release-transfer \
            --source-sha "$SOURCE_SHA" --tag "$TAG" --version "$VERSION" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --workflow .gitea/workflows/publish-gitea.yml

      - name: Obtain supervisor-signed completion evidence
        env:
          SOURCE_SHA: ${{ needs.validate-source.outputs.source_sha }}
        run: |
          set -euo pipefail
          umask 077
          python3 -I - "$GITHUB_RUN_ID" "$SOURCE_SHA" <<'PY'
          import ctypes
          import fcntl
          import hashlib
          import os
          import stat
          import subprocess
          import sys

          path = "/usr/local/bin/nmc-release-attestation-client"
          descriptor = os.open(path, os.O_RDONLY | os.O_CLOEXEC | os.O_NOFOLLOW)
          snapshot = -1
          try:
              parent = os.stat("/usr/local/bin", follow_symlinks=False)
              metadata = os.fstat(descriptor)
              raw = bytearray()
              while len(raw) <= 131072:
                  chunk = os.read(descriptor, min(65536, 131073 - len(raw)))
                  if not chunk:
                      break
                  raw.extend(chunk)
              after = os.fstat(descriptor)
              if (
                  not stat.S_ISDIR(parent.st_mode)
                  or parent.st_uid != 0
                  or stat.S_IMODE(parent.st_mode) & 0o022
                  or not stat.S_ISREG(metadata.st_mode)
                  or metadata.st_uid != 0
                  or stat.S_IMODE(metadata.st_mode) & 0o022
                  or metadata.st_nlink != 1
                  or metadata.st_size != len(raw)
                  or not 0 < len(raw) <= 131072
                  or (metadata.st_dev, metadata.st_ino, metadata.st_size, metadata.st_mtime_ns)
                  != (after.st_dev, after.st_ino, after.st_size, after.st_mtime_ns)
                  or hashlib.sha256(raw).hexdigest()
                  != "2b0bee25d755f284b5e8eee3b8a84536825328913040c8757374efe51c57f75f"
              ):
                  raise SystemExit("Release attestation client metadata or digest is unsafe")
              flags = getattr(os, "MFD_CLOEXEC", 0x0001) | getattr(
                  os, "MFD_ALLOW_SEALING", 0x0002
              )
              if hasattr(os, "memfd_create"):
                  snapshot = os.memfd_create("nmc-release-client", flags)
              else:
                  libc = ctypes.CDLL(None, use_errno=True)
                  memfd_create = libc.memfd_create
                  memfd_create.argtypes = (ctypes.c_char_p, ctypes.c_uint)
                  memfd_create.restype = ctypes.c_int
                  snapshot = memfd_create(b"nmc-release-client", flags)
                  if snapshot < 0:
                      error = ctypes.get_errno()
                      raise OSError(error, os.strerror(error))
              view = memoryview(raw)
              while view:
                  written = os.write(snapshot, view)
                  if written <= 0:
                      raise OSError("short immutable client snapshot write")
                  view = view[written:]
              os.fchmod(snapshot, 0o500)
              seals = 0x0001 | 0x0002 | 0x0004 | 0x0008
              fcntl.fcntl(snapshot, 1033, seals)
              if fcntl.fcntl(snapshot, 1034) != seals:
                  raise OSError("incomplete immutable client snapshot seals")
              subprocess.run(
                  [
                      f"/proc/self/fd/{snapshot}",
                      "complete",
                      "--acceptance", ".gitea/release-runner-acceptance.json",
                      "--repository", "emersonfelipesp/proxbox-api",
                      "--run-id", sys.argv[1],
                      "--job-name", "Build exact credential-free release-control request",
                      "--source-sha", sys.argv[2],
                      "--workflow", ".gitea/workflows/publish-gitea.yml",
                      "--request", "release-transfer/release-request.json",
                      "--manifest", "release-transfer/release-manifest.json",
                      "--artifact-root", "release-transfer",
                      "--output-attestation", "release-transfer/runner-completion-attestation.json",
                      "--output-signature", "release-transfer/runner-completion-attestation.sig",
                      "--public-key", "/etc/nmc-release-runner-attestation-public.pem",
                  ],
                  check=True,
                  env={"LANG": "C.UTF-8", "PATH": "/usr/local/bin:/usr/bin:/bin"},
                  pass_fds=(snapshot,),
                  timeout=60,
              )
          finally:
              if snapshot >= 0:
                  os.close(snapshot)
              os.close(descriptor)
          PY
          test "$(find release-transfer -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 6
          test "$(find release-transfer -mindepth 1 -maxdepth 1 -type l | wc -l)" -eq 0

      - name: Upload exact data-only control request
        run: |
          set -euo pipefail
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GITEA_TOKEN:-}"
          /usr/local/bin/nmc-upload-gitea-artifact \
            --root release-transfer --run-id "$GITHUB_RUN_ID"
