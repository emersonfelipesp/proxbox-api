name: Gitea Package Registry — Publish

on:
  # Deliberately `push` only. Gitea emits both `create` and `push` for a tag;
  # subscribing to both starts two immutable package uploads for one version.
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to publish (e.g. v0.0.16rc1 or v0.0.16)'
        required: true

jobs:
  validate-version:
    runs-on: mirror-host
    outputs:
      version: ${{ steps.extract.outputs.version }}
      is_rc: ${{ steps.extract.outputs.is_rc }}
      tag: ${{ steps.extract.outputs.tag }}
    steps:
      - name: Determine tag
        id: resolve_tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          # Validate tag format before use (v1.2.3 or v1.2.3rc4)
          TAG_PATTERN='^v[0-9]+\.[0-9]+\.[0-9]+(rc[0-9]+|\.post[0-9]+)?$'
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          elif [ "$EVENT_NAME" = "create" ]; then
            # create events fire for branches too — skip non-tag refs
            if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
              echo "Skipping create event for non-tag ref: ${GITHUB_REF}"
              exit 0
            fi
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if ! echo "${TAG}" | grep -qE "${TAG_PATTERN}"; then
            echo "ERROR: tag '${TAG}' does not match expected pattern ${TAG_PATTERN}"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_ENV"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Checkout exact public tag without Node.js
        if: ${{ steps.resolve_tag.outputs.tag != '' }}
        env:
          TAG: ${{ steps.resolve_tag.outputs.tag }}
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "emersonfelipesp/proxbox-api"
          printf '%s' "${TAG}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(rc[0-9]+|\.post[0-9]+)?$'
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          env -u GIT_ASKPASS -u SSH_ASKPASS \
            git -c credential.helper= -c http.extraHeader= fetch \
            --no-tags --depth=1 origin "refs/tags/${TAG}"
          RESOLVED_SHA="$(git rev-parse 'FETCH_HEAD^{commit}')"
          case "${GITHUB_EVENT_NAME}" in
            push) test "${RESOLVED_SHA}" = "${GITHUB_SHA}" ;;
            workflow_dispatch) test "${GITHUB_REF}" = "refs/heads/main" ;;
            *) exit 1 ;;
          esac
          git checkout --detach "${RESOLVED_SHA}"
          test "$(git rev-parse HEAD)" = "${RESOLVED_SHA}"

      - id: extract
        name: Extract and validate version
        if: ${{ steps.resolve_tag.outputs.tag != '' }}
        env:
          TAG: ${{ steps.resolve_tag.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if echo "${VERSION}" | grep -qE 'rc[0-9]+$'; then
            echo "is_rc=true" >> "$GITHUB_OUTPUT"
            echo "RC release: ${VERSION}"
          else
            echo "is_rc=false" >> "$GITHUB_OUTPUT"
            echo "Official release: ${VERSION}"
          fi
          # Validate pyproject.toml matches tag
          PYVER=$(python3 -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "${VERSION}" != "${PYVER}" ]; then
            echo "ERROR: tag ${TAG} (${VERSION}) does not match pyproject.toml version ${PYVER}"
            exit 1
          fi
          echo "Version ${VERSION} validated against pyproject.toml"

  publish-gitea:
    needs: validate-version
    if: ${{ needs.validate-version.outputs.version != '' }}
    runs-on: mirror-host
    env:
      VERSION: ${{ needs.validate-version.outputs.version }}
      TAG: ${{ needs.validate-version.outputs.tag }}
    steps:
      - name: Checkout exact public tag without Node.js
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "emersonfelipesp/proxbox-api"
          printf '%s' "${TAG}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(rc[0-9]+|\.post[0-9]+)?$'
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          env -u GIT_ASKPASS -u SSH_ASKPASS \
            git -c credential.helper= -c http.extraHeader= fetch \
            --no-tags --depth=1 origin "refs/tags/${TAG}"
          RESOLVED_SHA="$(git rev-parse 'FETCH_HEAD^{commit}')"
          case "${GITHUB_EVENT_NAME}" in
            push) test "${RESOLVED_SHA}" = "${GITHUB_SHA}" ;;
            workflow_dispatch) test "${GITHUB_REF}" = "refs/heads/main" ;;
            *) exit 1 ;;
          esac
          git checkout --detach "${RESOLVED_SHA}"
          test "$(git rev-parse HEAD)" = "${RESOLVED_SHA}"

      - name: Install build tools
        run: |
          set -euo pipefail
          RUNNER_TEMP="${RUNNER_TEMP:-$(mktemp -d)}"
          BOOTSTRAP_ROOT="${RUNNER_TEMP}/uv-bootstrap"
          UV_ARCHIVE="${RUNNER_TEMP}/uv-x86_64-unknown-linux-gnu.tar.gz"
          UV_URL="https://releases.astral.sh/github/uv/releases/download/0.11.28/uv-x86_64-unknown-linux-gnu.tar.gz"
          UV_SHA256="e490a6464492183c5d4534a5527fb4440f7f2bb2f228162ad7e4afe076dc0224"
          test "$(uname -m)" = "x86_64"
          test ! -e "${BOOTSTRAP_ROOT}"
          mkdir -m 0700 "${BOOTSTRAP_ROOT}"
          if ! command -v uv >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 --fail --location \
              --silent --show-error --max-filesize 104857600 \
              --output "${UV_ARCHIVE}" "${UV_URL}"
            printf '%s  %s\n' "${UV_SHA256}" "${UV_ARCHIVE}" \
              | sha256sum --check --strict
            tar -xzf "${UV_ARCHIVE}" -C "${BOOTSTRAP_ROOT}" \
              --no-same-owner --strip-components=1 \
              uv-x86_64-unknown-linux-gnu/uv
            chmod 0755 "${BOOTSTRAP_ROOT}/uv"
            export PATH="${BOOTSTRAP_ROOT}:${PATH}"
            echo "${BOOTSTRAP_ROOT}" >> "${GITHUB_PATH}"
          fi
          UV_VERSION="$(uv --version)"
          case "${UV_VERSION}" in
            "uv 0.11.28"|"uv 0.11.28 "*) ;;
            *) echo "Unexpected uv version: ${UV_VERSION}" >&2; exit 1 ;;
          esac

      - name: Build distributions
        run: |
          set -euo pipefail
          export HOME="${HOME:-/root}"
          export PATH="${HOME}/.local/bin:${PATH}"
          # The Gitea act runner does not always export RUNNER_TEMP, and `set -u`
          # would abort on it. The same guard the tool install step uses for HOME.
          RUNNER_TEMP="${RUNNER_TEMP:-$(mktemp -d)}"
          echo "RUNNER_TEMP=${RUNNER_TEMP}" >> "$GITHUB_ENV"

          # The wheel is built first, from the untouched checkout: it packages
          # proxbox_api only, and the offline preparation below rewrites
          # Dockerfile and populates docker/, which the wheel must not carry.
          uv build --wheel

          # The sdist is the artifact production deploys from, and the host
          # helper refuses one whose build context is not byte-inventoried and
          # network-free. Prepare that context exactly as the release-offline
          # lane in .github/workflows/ci.yml does, so what is published is what
          # that lane proves buildable with networking disabled.
          uv sync --frozen --only-group publish --no-install-project --python 3.13.14
          test ! -e docker/build-cache
          test ! -e docker/offline-build-inputs.json
          mkdir -m 0700 -p docker/build-cache
          # The requirements file lives inside the cache directory so the pinned
          # versions and hashes the image installs from are covered by the same
          # inventory digests as the wheels themselves.
          uv export --frozen --no-dev --group publish --no-emit-project \
            --format requirements-txt --python .venv/bin/python \
            --output-file docker/build-cache/offline-requirements.txt
          uv run python -m ensurepip --default-pip
          uv run python -m pip download \
            --disable-pip-version-check --require-hashes --only-binary=:all: \
            --platform musllinux_1_2_x86_64 --platform musllinux_1_1_x86_64 \
            --python-version 3.13 --implementation cp \
            --abi cp313 --abi abi3 --abi none \
            --dest docker/build-cache \
            --requirement docker/build-cache/offline-requirements.txt
          find docker/build-cache -mindepth 1 -maxdepth 1 -type f \
            \( -name '*.whl' -o -name 'offline-requirements.txt' \) \
            -exec chmod 0444 {} +
          uv run python scripts/prepare_offline_release.py
          uv run python -m build --no-isolation --sdist --outdir dist

          ls dist/

      - name: Verify the published sdist carries its offline build context
        run: |
          set -euo pipefail
          export HOME="${HOME:-/root}"
          export PATH="${HOME}/.local/bin:${PATH}"
          RUNNER_TEMP="${RUNNER_TEMP:-$(mktemp -d)}"
          SDIST="$(find dist -mindepth 1 -maxdepth 1 -type f -name 'proxbox_api-*.tar.gz' -print)"
          test -n "$SDIST"
          test "$(printf '%s\n' "$SDIST" | wc -l)" -eq 1
          uv run python scripts/verify_offline_release_sdist.py \
            --sdist "$SDIST" --version "${VERSION}" \
            --output "${RUNNER_TEMP}/proxbox-release-context"

      - name: Publish to Gitea Package Registry
        env:
          TWINE_USERNAME: emersonfelipesp
          TWINE_PASSWORD: ${{ secrets.PKG_TOKEN }}
          TWINE_REPOSITORY_URL: https://git.nmulti.cloud/api/packages/emersonfelipesp/pypi
        run: |
          export HOME="${HOME:-/root}"
          export PATH="${HOME}/.local/bin:${PATH}"
          uv run --with twine twine upload --non-interactive dist/*

      - name: Publish repository-linked release manifest
        env:
          GITEA_PACKAGE_TOKEN: ${{ secrets.PKG_TOKEN }}
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          printf '%s' "${SOURCE_SHA}" | grep -Eq '^[a-f0-9]{40}$'
          uv run python scripts/release_artifacts.py manifest \
            --dist dist --package proxbox_api --version "${VERSION}" \
            --source-sha "${SOURCE_SHA}" --manifest release-manifest.json
          uv run python scripts/release_artifacts.py publish-manifest \
            --owner emersonfelipesp --repository proxbox-api \
            --manifest release-manifest.json

      - name: Verify package in Gitea registry
        env:
          GITEA_TOKEN: ${{ secrets.PKG_TOKEN }}
        run: |
          set -euo pipefail
          PKG_NAME=$(python3 -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['name'])")
          sleep 5
          COUNT=$(curl -sf \
            "https://git.nmulti.cloud/api/v1/packages/emersonfelipesp?type=pypi&q=${PKG_NAME}&limit=50" \
            -H "Authorization: token ${GITEA_TOKEN}" \
            | VERSION="${VERSION}" python3 -c 'import json, os, sys; v = os.environ["VERSION"]; pkgs = json.load(sys.stdin); print(sum(1 for p in pkgs if p.get("version") == v))')
          echo "Found ${COUNT} package(s) matching ${PKG_NAME} ${VERSION}"
          if [ "${COUNT}" -lt 1 ]; then
            echo "ERROR: Package ${PKG_NAME} ${VERSION} not found in Gitea registry"
            exit 1
          fi
          echo "Package ${PKG_NAME} ${VERSION} successfully published to Gitea registry"

  push-to-github:
    needs: [validate-version, publish-gitea]
    # Manual dispatch is the safe package-only retry path. Public promotion is
    # reserved for the immutable tag-push run after production validation.
    if: ${{ needs.validate-version.outputs.version != '' && github.event_name == 'push' }}
    runs-on: mirror-host
    env:
      # The Gitea act runner does not export HOME; git and `gh auth setup-git`
      # abort with "fatal: $HOME not set" without this. mirror-host runs as root.
      HOME: /root
      VERSION: ${{ needs.validate-version.outputs.version }}
      TAG: ${{ needs.validate-version.outputs.tag }}
      IS_RC: ${{ needs.validate-version.outputs.is_rc }}
      GH_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
    steps:
      - name: Install GitHub CLI
        run: |
          set -euo pipefail
          if command -v gh >/dev/null 2>&1; then gh --version; exit 0; fi
          apt-get update -qq
          apt-get install -y ca-certificates curl gnupg
          mkdir -p -m 755 /etc/apt/keyrings
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            | tee /etc/apt/keyrings/githubcli-archive-keyring.gpg >/dev/null
          chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
            | tee /etc/apt/sources.list.d/github-cli.list >/dev/null
          apt-get update -qq
          apt-get install -y gh
          gh --version

      - name: Checkout exact public tag without Node.js
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "emersonfelipesp/proxbox-api"
          printf '%s' "${TAG}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(rc[0-9]+|\.post[0-9]+)?$'
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          env -u GIT_ASKPASS -u SSH_ASKPASS \
            git -c credential.helper= -c http.extraHeader= fetch \
            --no-tags --depth=1 origin "refs/tags/${TAG}"
          RESOLVED_SHA="$(git rev-parse 'FETCH_HEAD^{commit}')"
          case "${GITHUB_EVENT_NAME}" in
            push) test "${RESOLVED_SHA}" = "${GITHUB_SHA}" ;;
            workflow_dispatch) test "${GITHUB_REF}" = "refs/heads/main" ;;
            *) exit 1 ;;
          esac
          git checkout --detach "${RESOLVED_SHA}"
          test "$(git rev-parse HEAD)" = "${RESOLVED_SHA}"

      - name: Push tag to GitHub
        run: |
          set -euo pipefail
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          git config user.email "gitea-actions@git.nmulti.cloud"
          git config user.name "Gitea Actions"
          gh auth setup-git --hostname github.com --force
          git remote add github "https://github.com/emersonfelipesp/${REPO_NAME}.git" \
            || git remote set-url github "https://github.com/emersonfelipesp/${REPO_NAME}.git"
          git push github "refs/tags/${TAG}:refs/tags/${TAG}"
          echo "Tag ${TAG} pushed to GitHub"

      - name: Create or publish GitHub Release (non-RC only)
        if: env.IS_RC == 'false'
        run: |
          set -euo pipefail
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          GH_REPO="emersonfelipesp/${REPO_NAME}"
          NOTES_FILE="docs/release-notes/version-${VERSION}.md"
          if [ -f "${NOTES_FILE}" ]; then
            NOTES_ARGS="--notes-file ${NOTES_FILE}"
          else
            NOTES_ARGS="--generate-notes"
          fi
          TARGET_BRANCH="main"
          if gh release view "${TAG}" --repo "${GH_REPO}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists — ensuring it is not a draft"
            gh release edit "${TAG}" --repo "${GH_REPO}" --draft=false
            echo "Release ${TAG} published (was draft)"
          else
            gh release create "${TAG}" \
              --repo "${GH_REPO}" \
              --target "${TARGET_BRANCH}" \
              --title "${TAG}" \
              ${NOTES_ARGS}
            echo "GitHub release ${TAG} created for ${GH_REPO}"
          fi
