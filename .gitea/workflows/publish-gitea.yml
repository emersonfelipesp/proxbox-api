name: Gitea Release — Build Control Request

on:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: read

concurrency:
  group: release-request-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-source:
    name: Validate canonical release source
    runs-on: ci-release-proxbox-api
    outputs:
      source_sha: ${{ steps.policy.outputs.source_sha }}
      tag: ${{ steps.policy.outputs.tag }}
      version: ${{ steps.policy.outputs.version }}
    steps:
      - name: Checkout release source without persisted credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact accepted release runner before source validation
        env:
          GITEA_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f scripts/gitea_release_runner_gate.py
          test ! -L scripts/gitea_release_runner_gate.py
          test -f .gitea/release-runner-acceptance.json
          test ! -L .gitea/release-runner-acceptance.json
          printf '%s  %s\n' \
            7a4ca5d6c81161ec97459ca0e597d91c7219780b9aeada7741c838f320058dc0 \
            scripts/gitea_release_runner_gate.py | sha256sum --check --strict
          printf '%s  %s\n' \
            acadb6249a9516cb9d6219fd21e5ffb95864810069cc9664b3f1e6dfa6147107 \
            .gitea/release-runner-acceptance.json | sha256sum --check --strict
          python3 -I scripts/gitea_release_runner_gate.py \
            --acceptance .gitea/release-runner-acceptance.json \
            --owner emersonfelipesp --repository proxbox-api \
            --run-id "$GITHUB_RUN_ID" \
            --job-name "Validate canonical release source" \
            --source-sha "$(git rev-parse HEAD^{commit})"

      - name: Bind tag, version, canonical develop, and successful CI
        id: policy
        env:
          GITEA_API_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]* | v[0-9]*.[0-9]*.[0-9]*rc[0-9]* | v[0-9]*.[0-9]*.[0-9]*.post[0-9]*) ;;
            *) echo "Invalid release tag: $TAG"; exit 1 ;;
          esac
          git fetch --force --no-tags origin \
            "+refs/heads/develop:refs/remotes/gitea/release-develop" \
            "+refs/tags/${TAG}:refs/release-policy/candidate"
          SOURCE_SHA="$(git rev-parse refs/release-policy/candidate^{commit})"
          DEVELOP_SHA="$(git rev-parse refs/remotes/gitea/release-develop^{commit})"
          test "$SOURCE_SHA" = "$DEVELOP_SHA"
          test "$SOURCE_SHA" = "$(git rev-parse HEAD^{commit})"
          VERSION="${TAG#v}"
          python3 - "$VERSION" <<'PY'
          import pathlib
          import re
          import sys
          import tomllib

          version = sys.argv[1]
          if re.fullmatch(r"(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)(?:rc[1-9][0-9]*|\.post[1-9][0-9]*)?", version) is None:
              raise SystemExit("Release version is not canonical")
          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          if project["project"]["name"] != "proxbox_api":
              raise SystemExit("Unexpected package identity")
          if project["project"]["version"] != version:
              raise SystemExit("Tag and pyproject version differ")
          PY
          test -f scripts/gitea_ci_gate.py
          test ! -L scripts/gitea_ci_gate.py
          printf '%s  %s\n' \
            20ec5d0b6dae3145e5fa9f895dd2e1d702a4c12a4c6ee658c031b57f231a6f8c \
            scripts/gitea_ci_gate.py | sha256sum --check --strict
          python3 -I scripts/gitea_ci_gate.py \
            --owner emersonfelipesp --repository proxbox-api \
            --source-sha "$SOURCE_SHA" --trusted-actor emersonfelipesp \
            --required-context "CI / Lint, smoke, and core coverage (push)"
          printf 'tag=%s\nversion=%s\nsource_sha=%s\n' \
            "$TAG" "$VERSION" "$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  build-request:
    name: Build exact credential-free release-control request
    needs: validate-source
    runs-on: ci-release-proxbox-api
    steps:
      - name: Checkout validated source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.validate-source.outputs.source_sha }}
          persist-credentials: false

      - name: Prove exact accepted release runner before candidate execution
        env:
          GITEA_API_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.validate-source.outputs.source_sha }}
        run: |
          set -euo pipefail
          test -f scripts/gitea_release_runner_gate.py
          test ! -L scripts/gitea_release_runner_gate.py
          test -f .gitea/release-runner-acceptance.json
          test ! -L .gitea/release-runner-acceptance.json
          printf '%s  %s\n' \
            7a4ca5d6c81161ec97459ca0e597d91c7219780b9aeada7741c838f320058dc0 \
            scripts/gitea_release_runner_gate.py | sha256sum --check --strict
          printf '%s  %s\n' \
            acadb6249a9516cb9d6219fd21e5ffb95864810069cc9664b3f1e6dfa6147107 \
            .gitea/release-runner-acceptance.json | sha256sum --check --strict
          python3 -I scripts/gitea_release_runner_gate.py \
            --acceptance .gitea/release-runner-acceptance.json \
            --owner emersonfelipesp --repository proxbox-api \
            --run-id "$GITHUB_RUN_ID" \
            --job-name "Build exact credential-free release-control request" \
            --source-sha "$SOURCE_SHA"

      - name: Install checksum-verified uv and managed Python
        env:
          BOOTSTRAP_CACHE_ROOT: ${{ runner.temp }}/proxbox-api-uv-cache-${{ github.run_id }}-${{ github.run_attempt }}
          BOOTSTRAP_PYTHON_ROOT: ${{ runner.temp }}/proxbox-api-python-${{ github.run_id }}-${{ github.run_attempt }}
          BOOTSTRAP_UV_ROOT: ${{ runner.temp }}/proxbox-api-uv-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test ! -e "$BOOTSTRAP_UV_ROOT"
          test ! -e "$BOOTSTRAP_PYTHON_ROOT"
          test ! -e "$BOOTSTRAP_CACHE_ROOT"
          mkdir -m 0700 "$BOOTSTRAP_UV_ROOT" "$BOOTSTRAP_PYTHON_ROOT" "$BOOTSTRAP_CACHE_ROOT"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$BOOTSTRAP_UV_ROOT/uv.tar.gz" \
            https://github.com/astral-sh/uv/releases/download/0.11.28/uv-x86_64-unknown-linux-gnu.tar.gz
          printf '%s  %s\n' \
            e490a6464492183c5d4534a5527fb4440f7f2bb2f228162ad7e4afe076dc0224 \
            "$BOOTSTRAP_UV_ROOT/uv.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$BOOTSTRAP_UV_ROOT/uv.tar.gz" \
            --directory "$BOOTSTRAP_UV_ROOT" --strip-components=1 \
            uv-x86_64-unknown-linux-gnu/uv
          chmod 0555 "$BOOTSTRAP_UV_ROOT/uv"
          printf 'UV_BIN=%s\nUV_PYTHON_INSTALL_DIR=%s\n' \
            "$BOOTSTRAP_UV_ROOT/uv" "$BOOTSTRAP_PYTHON_ROOT" >> "$GITHUB_ENV"
          "$BOOTSTRAP_UV_ROOT/uv" python install \
            --no-config --cache-dir "$BOOTSTRAP_CACHE_ROOT" \
            --install-dir "$BOOTSTRAP_PYTHON_ROOT" --managed-python --no-bin 3.13.14

      - name: Build artifacts across a token-free UID boundary
        env:
          BUILD_ROOT: /nmc-build/proxbox-api-${{ github.run_id }}-${{ github.run_attempt }}
          SOURCE_SHA: ${{ needs.validate-source.outputs.source_sha }}
          TAG: ${{ needs.validate-source.outputs.tag }}
          VERSION: ${{ needs.validate-source.outputs.version }}
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_RUN_ATTEMPT" = 1
          test ! -e "$BUILD_ROOT"
          test ! -L "$BUILD_ROOT"
          printf '%s  %s\n' \
            a341691b6f7298d43c517f027b31fe4a783e009810b17f8e7be34f0ae2bf7868 \
            scripts/gitea_release_build_boundary.py | sha256sum --check --strict
          python3 -I scripts/gitea_release_build_boundary.py \
            --build-root "$BUILD_ROOT" --uv-bin "$UV_BIN" \
            --python-root "$UV_PYTHON_INSTALL_DIR" --source-sha "$SOURCE_SHA" \
            --tag "$TAG" --version "$VERSION" --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Bind exact artifacts into the control request
        env:
          BUILD_ROOT: /nmc-build/proxbox-api-${{ github.run_id }}-${{ github.run_attempt }}
          SOURCE_SHA: ${{ needs.validate-source.outputs.source_sha }}
          TAG: ${{ needs.validate-source.outputs.tag }}
          VERSION: ${{ needs.validate-source.outputs.version }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s  %s\n' \
            4017b7dc0443e4827f27c0571d41188e63f19bffdcb3e785307de1a084561002 \
            scripts/gitea_release_handoff.py | sha256sum --check --strict
          python3 -I scripts/gitea_release_handoff.py \
            --build-root "$BUILD_ROOT" --transfer-root release-transfer \
            --source-sha "$SOURCE_SHA" --tag "$TAG" --version "$VERSION" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --workflow .gitea/workflows/publish-gitea.yml

      - name: Obtain supervisor-signed completion evidence
        env:
          SOURCE_SHA: ${{ needs.validate-source.outputs.source_sha }}
        run: |
          set -euo pipefail
          umask 077
          test -x /usr/local/bin/nmc-release-attestation-client
          test ! -L /usr/local/bin/nmc-release-attestation-client
          /usr/local/bin/nmc-release-attestation-client complete \
            --acceptance .gitea/release-runner-acceptance.json \
            --repository emersonfelipesp/proxbox-api \
            --run-id "$GITHUB_RUN_ID" \
            --job-name "Build exact credential-free release-control request" \
            --source-sha "$SOURCE_SHA" \
            --workflow .gitea/workflows/publish-gitea.yml \
            --request release-transfer/release-request.json \
            --manifest release-transfer/release-manifest.json \
            --artifact-root release-transfer \
            --output-attestation release-transfer/runner-completion-attestation.json \
            --output-signature release-transfer/runner-completion-attestation.sig
          test "$(find release-transfer -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 6
          test "$(find release-transfer -mindepth 1 -maxdepth 1 -type l | wc -l)" -eq 0

      - name: Upload exact data-only control request
        uses: actions/upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de # v3.2.2-node20
        with:
          name: release-control-request
          path: release-transfer
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
