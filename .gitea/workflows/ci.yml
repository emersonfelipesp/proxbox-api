name: CI

# Authoritative pre-merge gate for Gitea feature branches. The dedicated label
# is intentionally unschedulable until N-MultiCloud/nmulticloud-context#204
# provisions an ephemeral, unprivileged runner with no production credentials.

# push runs are limited to the long-lived branches: an unrestricted push
# trigger made every feature-branch push start a push run AND a pull_request
# run of the same tree, and the two ~55m suites kept landing together on one
# capacity-2, 8-CPU-quota runner where both overran its 60m timeout.
on:
  push:
    branches:
      - main
      - develop
  pull_request:

# Repo-wide, not per-ref. Narrowing the push trigger above stopped a branch
# racing its own pull-request run, but a per-ref group still let two different
# refs land together -- PR vs PR, or a develop push vs a PR. Two jobs on the
# capacity-2 runner put 2x8 xdist workers on its 8-CPU quota, and the resulting
# memory pressure kills workers. cancel-in-progress stays false on purpose: a
# global group that cancels would let a pull-request run kill a develop/main
# push run, destroying the push status that the deploy workflow's
# "Verify CI for the exact deployed source" gate reads.
concurrency:
  group: proxbox-api-ci
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    name: Lint, smoke, and core coverage
    runs-on: ci-untrusted-python312
    # 90, not 30. The full suite (~2200 tests, some rebuilding the FastAPI app
    # per test) exceeds 30 min on the shared, CPU-quota'd ci-untrusted runner --
    # jobs were killed at exactly 30 min and recorded as `failure` despite every
    # truncated log ending mid-run all-passing. Local wall-clock is ~13 min; 90
    # gives comfortable headroom on the slower runner. The runner's own
    # config.yaml `timeout` was raised to match.
    timeout-minutes: 90
    env:
      HOME: ${{ github.workspace }}
      UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
      UV_PYTHON_DOWNLOADS: never
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Verify runner toolchain
        shell: bash
        run: |
          set -eo pipefail
          export HOME="${GITHUB_WORKSPACE:-$PWD}"
          export PATH="$HOME/.local/bin:$PATH"
          command -v uv >/dev/null 2>&1
          uv --version
          uv python find 3.12

      - name: Sync locked dependencies
        shell: bash
        run: |
          set -eo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          uv sync --frozen --extra test --group dev --python 3.12

      - name: Ruff lint and format
        shell: bash
        run: |
          set -eo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          uv run ruff check .
          uv run ruff format --check .

      - name: Ty type check
        shell: bash
        run: |
          set -eo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          uv run ty check \
            proxbox_api/types \
            proxbox_api/utils/retry.py \
            proxbox_api/schemas/sync.py

      - name: Compile and import smoke checks
        shell: bash
        run: |
          set -eo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          uv run python -m compileall proxbox_api scripts tests
          uv run python -c "import proxbox_api.main"
          uv run python -c "import proxmox_sdk.mock_main"
          uv run python -c "from proxbox_api.proxmox_to_netbox.proxmox_schema import load_proxmox_generated_openapi; assert load_proxmox_generated_openapi().get('paths')"

      - name: Core tests with coverage
        shell: bash
        # The shared ci-untrusted-python312 runner pool includes a member with a
        # 60-minute job timeout, and the previous verbose branch-coverage
        # invocation took ~59m on the fastest pool member -- any job landing on
        # the 60m runner was killed mid-run with every logged test passing.
        # Statement-only coverage lets coverage.py use its low-overhead sysmon
        # core on Python 3.12 (branch events need 3.14), worksteal rebalances
        # xdist stragglers, and dropping -v/term-missing removes megabytes of
        # log output. Branch coverage still runs in the .github/ CI on
        # GitHub-hosted runners. -n is pinned, not auto: the runner containers
        # carry an 8-CPU NanoCpus quota without a cpuset, so os.cpu_count()
        # reports the 28-core host and -n auto oversubscribes 28 workers onto
        # 8 CPUs of quota.
        env:
          COVERAGE_CORE: sysmon
        run: |
          set -eo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          uv run pytest tests/ -n 8 --dist worksteal \
            --max-worker-restart=0 \
            --ignore=tests/e2e \
            --ignore=tests/test_generated_proxmox_routes.py \
            --tb=short \
            --cov=proxbox_api \
            --cov-report=xml:coverage.xml

      - name: Upload coverage report
        if: ${{ always() }}
        # v3, not v4: Gitea Actions does not implement the @actions/artifact v2+
        # (upload-artifact@v4+) API and fails the step with GHESNotSupportedError.
        # v3.1.3 uses the older artifact API that the Gitea runner supports. The
        # .github/ CI keeps v4 since it runs on GitHub-hosted runners.
        uses: actions/upload-artifact@a8a3f3ad30e3422c9c7b888a15615d19a852ae32 # v3.1.3
        with:
          name: coverage-py312-gitea
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14
