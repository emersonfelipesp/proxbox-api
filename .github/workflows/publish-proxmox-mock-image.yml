name: Publish qualified proxmox-mock-api image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact qualified proxmox-mock-api version
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: proxmox-mock-image-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare-image-inputs:
    runs-on: ubuntu-latest
    environment: standalone-mock-production
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.12.5"
          enable-cache: false

      - name: Require an exact version and a fully populated manifest
        run: |
          python -I -B proxmox-mock/release/release_contract.py validate \
            --manifest proxmox-mock/release/release-manifest.toml \
            --pyproject proxmox-mock/pyproject.toml \
            --version "${VERSION}"

      - name: Download the qualified application wheel and export the frozen dependency graph
        run: |
          mkdir -p proxmox-mock/release/build-inputs/dist
          python -m pip download --no-deps --only-binary=:all: \
            --dest proxmox-mock/release/build-inputs/dist \
            "proxmox-mock-api==${VERSION}"
          uv export --project proxmox-mock --frozen --no-dev --no-emit-project \
            --no-annotate --no-header \
            --output-file proxmox-mock/release/build-inputs/requirements.lock

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proxmox-mock-image-inputs
          path: proxmox-mock/release/build-inputs/
          if-no-files-found: error

  publish-platform:
    needs: prepare-image-inputs
    runs-on: ubuntu-latest
    environment: standalone-mock-production
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            pip-platform: manylinux2014_x86_64
            suffix: amd64
          - platform: linux/arm64
            pip-platform: manylinux2014_aarch64
            suffix: arm64
    env:
      VERSION: ${{ inputs.version }}
      TARGET_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: proxmox-mock-image-inputs
          path: proxmox-mock/release/context

      - name: Download and authenticate the platform dependency wheel graph
        run: |
          mkdir proxmox-mock/release/context/wheelhouse
          python -m pip download --require-hashes --only-binary=:all: \
            --platform "${{ matrix.pip-platform }}" --python-version 3.13 \
            --implementation cp --abi cp313 \
            --dest proxmox-mock/release/context/wheelhouse \
            --requirement proxmox-mock/release/context/requirements.lock
          cp proxmox-mock/release/release-manifest.toml proxmox-mock/release/context/
          cp proxmox-mock/release/release_contract.py proxmox-mock/release/context/
          WHEEL_FILENAME="$(python -I -B proxmox-mock/release/release_contract.py wheel-filename \
            --manifest proxmox-mock/release/release-manifest.toml)"
          python -I -B proxmox-mock/release/release_contract.py application-requirement \
            --manifest proxmox-mock/release/release-manifest.toml \
            > proxmox-mock/release/context/application-wheel.txt
          python -I -B proxmox-mock/release/release_contract.py verify-context \
            --manifest proxmox-mock/release/release-manifest.toml \
            --platform "${TARGET_PLATFORM}" \
            --wheel "proxmox-mock/release/context/dist/${WHEEL_FILENAME}" \
            --requirements proxmox-mock/release/context/requirements.lock \
            --wheelhouse proxmox-mock/release/context/wheelhouse

      - name: Select immutable platform images
        id: images
        run: |
          echo "base=$(python -I -B proxmox-mock/release/release_contract.py image-ref --manifest proxmox-mock/release/release-manifest.toml --platform "${TARGET_PLATFORM}" --kind base)" >> "${GITHUB_OUTPUT}"
          echo "uv=$(python -I -B proxmox-mock/release/release_contract.py image-ref --manifest proxmox-mock/release/release-manifest.toml --platform "${TARGET_PLATFORM}" --kind uv)" >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./proxmox-mock
          file: ./proxmox-mock/Dockerfile
          push: true
          platforms: ${{ matrix.platform }}
          build-args: |
            PYTHON_BASE_IMAGE=${{ steps.images.outputs.base }}
            UV_IMAGE=${{ steps.images.outputs.uv }}
          tags: emersonfelipesp/proxmox-mock-api:${{ inputs.version }}-${{ matrix.suffix }}

      - name: Record the current-run platform digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test "$(printf '%s' "${IMAGE_DIGEST}" | grep -Ec '^sha256:[0-9a-f]{64}$')" = 1
          printf '%s\n' "${IMAGE_DIGEST}" > "digest-${{ matrix.suffix }}.txt"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proxmox-mock-image-digest-${{ matrix.suffix }}
          path: digest-${{ matrix.suffix }}.txt
          if-no-files-found: error

  publish-index:
    needs: publish-platform
    runs-on: ubuntu-latest
    environment: standalone-mock-production
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: proxmox-mock-image-digest-amd64
          path: ${{ runner.temp }}/image-digests/amd64

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: proxmox-mock-image-digest-arm64
          path: ${{ runner.temp }}/image-digests/arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish the qualified multi-platform version tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          AMD64_DIGEST="$(cat "${RUNNER_TEMP}/image-digests/amd64/digest-amd64.txt")"
          ARM64_DIGEST="$(cat "${RUNNER_TEMP}/image-digests/arm64/digest-arm64.txt")"
          test "$(printf '%s' "${AMD64_DIGEST}" | grep -Ec '^sha256:[0-9a-f]{64}$')" = 1
          test "$(printf '%s' "${ARM64_DIGEST}" | grep -Ec '^sha256:[0-9a-f]{64}$')" = 1
          docker buildx imagetools create \
            --tag "emersonfelipesp/proxmox-mock-api:${VERSION}" \
            "emersonfelipesp/proxmox-mock-api@${AMD64_DIGEST}" \
            "emersonfelipesp/proxmox-mock-api@${ARM64_DIGEST}"
