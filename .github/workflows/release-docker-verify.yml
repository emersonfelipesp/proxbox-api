name: Release Docker verification

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to verify (e.g. v0.0.9.post1)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to verify (e.g. v0.0.9.post1)"
        required: true
        type: string

env:
  # Required since v0.0.10: proxbox-api refuses to start without an
  # encryption key (or PROXBOX_ALLOW_PLAINTEXT_CREDENTIALS=1). Use a
  # constant CI-only key so released images go through the same code
  # path operators use in production.
  PROXBOX_ENCRYPTION_KEY: proxbox-ci-only-encryption-key-not-a-secret

jobs:
  verify-image:
    name: verify Docker images on release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(\.post[0-9]+)?$ ]]; then
            echo "::error::Release tag must be a final or post-release version tag"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Pull release and latest images
        id: capture-digests
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          REL="$RELEASE_TAG"
          TAG="${REL#v}"
          # Publication completed before the reusable workflow was called. Keep
          # bounded retries for registry propagation and transient pull errors.
          pull_with_retry() {
            local image="$1"
            local attempt=0
            local max_attempts=60   # 60 * 60s = 60 minutes
            until docker pull "$image"; do
              attempt=$((attempt + 1))
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "::error::Image $image not available after $max_attempts attempts"
                return 1
              fi
              echo "Image $image not available yet (attempt $attempt/$max_attempts), retrying in 60s..."
              sleep 60
            done
          }
          pull_with_retry emersonfelipesp/proxbox-api:"$TAG"
          pull_with_retry emersonfelipesp/proxbox-api:latest
          pull_with_retry emersonfelipesp/proxbox-api:"${TAG}-nginx"
          pull_with_retry emersonfelipesp/proxbox-api:latest-nginx
          pull_with_retry emersonfelipesp/proxbox-api:"${TAG}-granian"
          pull_with_retry emersonfelipesp/proxbox-api:latest-granian
          pull_with_retry emersonfelipesp/proxbox-api:"${TAG}-pyo3-rust"
          pull_with_retry emersonfelipesp/proxbox-api:experimental
          pull_with_retry emersonfelipesp/proxbox-api:pyo3-rust
          pull_with_retry emersonfelipesp/proxbox-api:"${TAG}-pyo3-rust-nginx"
          pull_with_retry emersonfelipesp/proxbox-api:experimental-nginx
          pull_with_retry emersonfelipesp/proxbox-api:pyo3-rust-nginx
          pull_with_retry emersonfelipesp/proxbox-api:"${TAG}-pyo3-rust-granian"
          pull_with_retry emersonfelipesp/proxbox-api:experimental-granian
          pull_with_retry emersonfelipesp/proxbox-api:pyo3-rust-granian

          image_digest() {
            docker buildx imagetools inspect "$1" --format '{{ .Manifest.Digest }}'
          }
          capture_digest() {
            local output_name="$1"
            local versioned="$2"
            shift 2
            local versioned_digest
            local alias_digest
            versioned_digest="$(image_digest "$versioned")"
            test -n "$versioned_digest"
            for alias in "$@"; do
              alias_digest="$(image_digest "$alias")"
              if [ "$versioned_digest" != "$alias_digest" ]; then
                echo "::error::Alias $alias does not resolve to versioned image $versioned"
                return 1
              fi
            done
            printf '%s=%s\n' "$output_name" "$versioned_digest" >> "$GITHUB_OUTPUT"
          }

          capture_digest raw emersonfelipesp/proxbox-api:"$TAG" emersonfelipesp/proxbox-api:latest
          capture_digest nginx emersonfelipesp/proxbox-api:"${TAG}-nginx" emersonfelipesp/proxbox-api:latest-nginx
          capture_digest granian emersonfelipesp/proxbox-api:"${TAG}-granian" emersonfelipesp/proxbox-api:latest-granian
          capture_digest rust_raw emersonfelipesp/proxbox-api:"${TAG}-pyo3-rust" emersonfelipesp/proxbox-api:experimental emersonfelipesp/proxbox-api:pyo3-rust
          capture_digest rust_nginx emersonfelipesp/proxbox-api:"${TAG}-pyo3-rust-nginx" emersonfelipesp/proxbox-api:experimental-nginx emersonfelipesp/proxbox-api:pyo3-rust-nginx
          capture_digest rust_granian emersonfelipesp/proxbox-api:"${TAG}-pyo3-rust-granian" emersonfelipesp/proxbox-api:experimental-granian emersonfelipesp/proxbox-api:pyo3-rust-granian

      - name: Smoke-test published startup
        env:
          RAW_REF: emersonfelipesp/proxbox-api@${{ steps.capture-digests.outputs.raw }}
          NGINX_REF: emersonfelipesp/proxbox-api@${{ steps.capture-digests.outputs.nginx }}
          GRANIAN_REF: emersonfelipesp/proxbox-api@${{ steps.capture-digests.outputs.granian }}
          RUST_RAW_REF: emersonfelipesp/proxbox-api@${{ steps.capture-digests.outputs.rust_raw }}
          RUST_NGINX_REF: emersonfelipesp/proxbox-api@${{ steps.capture-digests.outputs.rust_nginx }}
          RUST_GRANIAN_REF: emersonfelipesp/proxbox-api@${{ steps.capture-digests.outputs.rust_granian }}
        run: |
          set -eux

          # raw (HTTP)
          docker rm -f proxbox-release-raw 2>/dev/null || true
          docker run -d --name proxbox-release-raw \
            -p 127.0.0.1:18080:8000 \
            -e PROXBOX_SKIP_NETBOX_BOOTSTRAP=1 \
            -e PROXBOX_ENCRYPTION_KEY \
            "$RAW_REF"
          for i in $(seq 1 40); do
            if curl -fsS --max-time 5 http://127.0.0.1:18080/ >/dev/null 2>&1; then
              docker rm -f proxbox-release-raw
              break
            fi
            sleep 2
            if [ "$i" -eq 40 ]; then
              docker logs proxbox-release-raw
              docker rm -f proxbox-release-raw
              exit 1
            fi
          done

          # nginx (HTTPS)
          docker rm -f proxbox-release-nginx 2>/dev/null || true
          docker run -d --name proxbox-release-nginx \
            -p 127.0.0.1:18443:8000 \
            -e PROXBOX_SKIP_NETBOX_BOOTSTRAP=1 \
            -e PROXBOX_ENCRYPTION_KEY \
            "$NGINX_REF"
          for i in $(seq 1 40); do
            if curl -kfsS --max-time 5 https://127.0.0.1:18443/ >/dev/null 2>&1; then
              docker rm -f proxbox-release-nginx
              break
            fi
            sleep 2
            if [ "$i" -eq 40 ]; then
              docker logs proxbox-release-nginx
              docker rm -f proxbox-release-nginx
              exit 1
            fi
          done

          # granian (HTTPS)
          docker rm -f proxbox-release-granian 2>/dev/null || true
          docker run -d --name proxbox-release-granian \
            -p 127.0.0.1:18444:8000 \
            -e PROXBOX_SKIP_NETBOX_BOOTSTRAP=1 \
            -e PROXBOX_ENCRYPTION_KEY \
            "$GRANIAN_REF"
          for i in $(seq 1 40); do
            if curl -kfsS --max-time 5 https://127.0.0.1:18444/ >/dev/null 2>&1; then
              docker rm -f proxbox-release-granian
              break
            fi
            sleep 2
            if [ "$i" -eq 40 ]; then
              docker logs proxbox-release-granian
              docker rm -f proxbox-release-granian
              exit 1
            fi
          done

          verify_rust_image() {
            local image_ref="$1"
            local name="$2"
            local port="$3"
            local url="$4"
            local curl_flags="$5"
            docker run --rm \
              -e PROXBOX_ENCRYPTION_KEY \
              "$image_ref" \
              python -c "import os; from proxbox_api.services.sync.reconciliation.rust_bridge import rust_available; assert os.environ.get('PROXBOX_RECONCILIATION_ENGINE') == 'rust'; assert rust_available()"

            docker rm -f "$name" 2>/dev/null || true
            docker run -d --name "$name" \
              -p "127.0.0.1:${port}:8000" \
              -e PROXBOX_SKIP_NETBOX_BOOTSTRAP=1 \
              -e PROXBOX_ENCRYPTION_KEY \
              "$image_ref"
            for i in $(seq 1 40); do
              if curl $curl_flags --max-time 5 "$url" >/dev/null 2>&1; then
                docker rm -f "$name"
                return 0
              fi
              sleep 2
              if [ "$i" -eq 40 ]; then
                docker logs "$name"
                docker rm -f "$name"
                return 1
              fi
            done
          }

          verify_rust_image "$RUST_RAW_REF" proxbox-release-pyo3-rust 18081 http://127.0.0.1:18081/ "-fsS"
          verify_rust_image "$RUST_RAW_REF" proxbox-release-experimental 18082 http://127.0.0.1:18082/ "-fsS"
          verify_rust_image "$RUST_RAW_REF" proxbox-release-pyo3-rust-alias 18083 http://127.0.0.1:18083/ "-fsS"

          verify_rust_image "$RUST_NGINX_REF" proxbox-release-pyo3-rust-nginx 18445 https://127.0.0.1:18445/ "-kfsS"
          verify_rust_image "$RUST_NGINX_REF" proxbox-release-experimental-nginx 18447 https://127.0.0.1:18447/ "-kfsS"
          verify_rust_image "$RUST_NGINX_REF" proxbox-release-pyo3-rust-nginx-alias 18448 https://127.0.0.1:18448/ "-kfsS"

          verify_rust_image "$RUST_GRANIAN_REF" proxbox-release-pyo3-rust-granian 18446 https://127.0.0.1:18446/ "-kfsS"
          verify_rust_image "$RUST_GRANIAN_REF" proxbox-release-experimental-granian 18449 https://127.0.0.1:18449/ "-kfsS"
          verify_rust_image "$RUST_GRANIAN_REF" proxbox-release-pyo3-rust-granian-alias 18450 https://127.0.0.1:18450/ "-kfsS"

      - name: Confirm mutable aliases stayed bound to captured digests
        env:
          RAW_DIGEST: ${{ steps.capture-digests.outputs.raw }}
          NGINX_DIGEST: ${{ steps.capture-digests.outputs.nginx }}
          GRANIAN_DIGEST: ${{ steps.capture-digests.outputs.granian }}
          RUST_RAW_DIGEST: ${{ steps.capture-digests.outputs.rust_raw }}
          RUST_NGINX_DIGEST: ${{ steps.capture-digests.outputs.rust_nginx }}
          RUST_GRANIAN_DIGEST: ${{ steps.capture-digests.outputs.rust_granian }}
        run: |
          assert_digest() {
            local image="$1"
            local expected="$2"
            local actual
            actual="$(docker buildx imagetools inspect "$image" --format '{{ .Manifest.Digest }}')"
            if [ "$actual" != "$expected" ]; then
              echo "::error::Alias $image changed during verification"
              return 1
            fi
          }
          assert_digest emersonfelipesp/proxbox-api:latest "$RAW_DIGEST"
          assert_digest emersonfelipesp/proxbox-api:latest-nginx "$NGINX_DIGEST"
          assert_digest emersonfelipesp/proxbox-api:latest-granian "$GRANIAN_DIGEST"
          assert_digest emersonfelipesp/proxbox-api:experimental "$RUST_RAW_DIGEST"
          assert_digest emersonfelipesp/proxbox-api:pyo3-rust "$RUST_RAW_DIGEST"
          assert_digest emersonfelipesp/proxbox-api:experimental-nginx "$RUST_NGINX_DIGEST"
          assert_digest emersonfelipesp/proxbox-api:pyo3-rust-nginx "$RUST_NGINX_DIGEST"
          assert_digest emersonfelipesp/proxbox-api:experimental-granian "$RUST_GRANIAN_DIGEST"
          assert_digest emersonfelipesp/proxbox-api:pyo3-rust-granian "$RUST_GRANIAN_DIGEST"
